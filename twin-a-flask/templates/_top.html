{# FR-01: shared page shell (head, sidebar, notice). Twin B: views/_top.ejs #}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }} · Expense Ledger</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="10" fill="#0d6b53"/><path d="M10 12.5h16M10 18h10M10 23.5h16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="25" cy="18" r="1.9" fill="#5fd3a8"/></svg>
      <span class="brand-text"><strong>Expense Ledger</strong><small>Household spending</small></span>
    </a>
    <nav class="nav" aria-label="Main">
      <p class="nav-label">Menu</p>
      <a class="nav-link{{ nav.overview }}" href="/"{% if section == "overview" %} aria-current="page"{% endif %}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="3" width="6" height="6" rx="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.6"/><rect x="3" y="11" width="6" height="6" rx="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.6"/></svg>Overview</a>
      <a class="nav-link{{ nav.expenses }}" href="/expenses"{% if section == "expenses" %} aria-current="page"{% endif %}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M7.5 5.5h9M7.5 10h9M7.5 14.5h9"/><circle cx="4" cy="5.5" r=".9" fill="currentColor"/><circle cx="4" cy="10" r=".9" fill="currentColor"/><circle cx="4" cy="14.5" r=".9" fill="currentColor"/></svg>Expenses</a>
      <a class="nav-link{{ nav.add }}" href="/expenses/new"{% if section == "add" %} aria-current="page"{% endif %}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 6.8v6.4M6.8 10h6.4"/></svg>Add expense</a>
      <a class="nav-link{{ nav.reports }}" href="/reports"{% if section == "reports" %} aria-current="page"{% endif %}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M3.5 16.5h13M6 13.5V9M10 13.5V4.5M14 13.5V7.5"/></svg>Reports</a>
      <a class="nav-link{{ nav.data }}" href="/data"{% if section == "data" %} aria-current="page"{% endif %}><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><ellipse cx="10" cy="5" rx="6" ry="2.3"/><path d="M4 5v10c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3V5M4 10c0 1.3 2.7 2.3 6 2.3s6-1 6-2.3"/></svg>Data</a>
    </nav>
    <div class="side-foot">
      <strong>Omani rial · OMR</strong>
      1 OMR = 1,000 baisa
    </div>
  </aside>
  <main class="main">
    <div class="page">
      {% if notice %}
      <div class="notice" role="status"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="m6.8 10.2 2.2 2.2 4.3-4.6"/></svg>{{ notice }}</div>
      {% endif %}
